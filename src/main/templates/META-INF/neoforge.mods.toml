license = "${mod_license}"
issueTrackerURL = "https://github.com/Ametrin-Studios/AmetrinStructures/issues" #optional

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
updateJSONURL = "https://raw.githubusercontent.com/Ametrin-Studios/AmetrinStructures/main/updates.json" #optional
displayURL = "https://www.curseforge.com/minecraft/mc-mods/ametrin-structures" #optional
#logoFile="examplemod.png" #optional
#credits="" #optional
authors = "Ametrin Studios"

description = '''
A library for structure and worldgen developers: authoring foam, structure and simple-structure
builders, grid placement, lake-proofing, fixture blocks and spawner profiles.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"


[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
